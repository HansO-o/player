name: Player build and real playback

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback:
    name: ${{ matrix.browser }} audio and video
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: true
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install browser and graphics/audio dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start a real audio clock with a null output device
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=octo_test
          pactl set-default-sink octo_test
      - name: Verify real decoded pixels and PCM
        run: xvfb-run -a npm run test:e2e -- --project=${{ matrix.browser }} --headed
      - name: Preserve playback evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playback-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload ready to host demo and library
        if: success() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v7
        with:
          name: octo-player-dist
          path: dist/
          retention-days: 7
